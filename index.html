<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AttendTrack</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="app">
    <header class="app-header">
      <h1>AttendTrack</h1>
      <p>Church Service Attendance Counter</p>
    </header>

    <!-- service drop down -->
    <section class="service-select">
  <label for="service">Select Service:</label>
  <select id="service">
    <option value="service1">1st Service</option>
    <option value="service2">2nd Service</option>
    <option value="service3">3rd Service</option>
    <option value="service4">4th Service</option>
  </select>
</section>

    <section class="counters">

      <div class="counter-card">
        <h2>Male</h2>
        <div class="controls">
          <button class="btn decrease" data-type="male">−</button>
          <span id="maleCount" class="count">0</span>
          <button class="btn increase" data-type="male">+</button>
        </div>
      </div>

      <div class="counter-card">
        <h2>Female</h2>
        <div class="controls">
          <button class="btn decrease" data-type="female">−</button>
          <span id="femaleCount" class="count">0</span>
          <button class="btn increase" data-type="female">+</button>
        </div>
      </div>

      <div class="counter-card">
        <h2>Children</h2>
        <div class="controls">
          <button class="btn decrease" data-type="children">−</button>
          <span id="childrenCount" class="count">0</span>
          <button class="btn increase" data-type="children">+</button>
        </div>
      </div>

    </section>

    <section class="total-section">
      <h2>Total Attendance</h2>
      <span id="totalCount" class="total-count">0</span>
    </section>

    <section class="actions">
      <button id="resetBtn" class="reset-btn">Reset</button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
